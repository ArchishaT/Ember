<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Ember — a one-line journal that keeps your streak alive</title>
    <meta
      name="description"
      content="Write one good thing and one hard thing about today, in under a minute. Ember tracks your streak and turns each entry into a shareable day card."
    />
    <link rel="canonical" href="https://ember-journal.app/" />
    <meta name="theme-color" content="#17140f" />
    <meta name="color-scheme" content="dark" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph / social share -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ember" />
    <meta
      property="og:title"
      content="Ember — a one-line journal that keeps your streak alive"
    />
    <meta
      property="og:description"
      content="Write one good thing and one hard thing about today, in under a minute. Ember tracks your streak and turns each entry into a shareable day card."
    />
    <meta property="og:url" content="https://ember-journal.app/" />
    <meta property="og:image" content="https://ember-journal.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Ember — a one-line journal that keeps your streak alive"
    />
    <meta
      name="twitter:description"
      content="Write one good thing and one hard thing about today, in under a minute."
    />
    <meta name="twitter:image" content="https://ember-journal.app/og-image.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Ember",
        "url": "https://ember-journal.app/",
        "applicationCategory": "LifestyleApplication",
        "operatingSystem": "Any (web browser)",
        "description": "A one-line-a-day journal that tracks streaks and generates shareable day cards.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
